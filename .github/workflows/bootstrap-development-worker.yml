name: Bootstrap development Worker only
run-name: Development Worker bootstrap @ ${{ github.sha }}
on:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      ${{ github.repository == 'ak-sekine/heibon-mahjong' && (github.event.head_commit.message == 'bootstrap: create development Worker (Issue #47)' || github.event.head_commit.message == 'bootstrap: complete development Worker (Issue #47)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck:worker
      - run: npx wrangler deploy --dry-run --config wrangler.development.jsonc
  bootstrap:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: worker-development
    concurrency:
      group: worker-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: create
        name: Create or complete development Worker and verify actual URL and DO bindings
        run: node .github/scripts/bootstrap-development-worker.mjs "$BOOTSTRAP_OPERATION"
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_OPERATION: >-
            ${{ github.event.head_commit.message == 'bootstrap: complete development Worker (Issue #47)' && 'complete' || 'create' }}
          EXPECTED_DEVELOPMENT_SETTINGS_SHA256: 750d7549649787febbaa88e8b5eac688ee19b29c724be559ae6e991e8850934d
          BOOTSTRAP_REQUEST: ${{ github.event.head_commit.message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify development DO room lifecycle, game and reconnect
        run: npm run test:online:production
        env:
          ONLINE_API_URL: ${{ steps.create.outputs.url }}
          ONLINE_TEST_ORIGIN: https://ak-sekine.github.io
      - name: Verify development RATE_LIMITER quota without joining a room
        run: node .github/scripts/bootstrap-development-worker.mjs rate-limit
        env:
          ONLINE_API_URL: ${{ steps.create.outputs.url }}
      - name: Confirm verified endpoint for manual registration
        env:
          ACTUAL_URL: ${{ steps.create.outputs.url }}
        run: |
          printf '\nAll bootstrap checks passed. Register repository variable DEVELOPMENT_WORKER_URL=%s\n' "$ACTUAL_URL" >> "$GITHUB_STEP_SUMMARY"
  inspect:
    if: >-
      ${{ github.repository == 'ak-sekine/heibon-mahjong' && github.event.head_commit.message == 'bootstrap: inspect development Worker (Issue #47)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: worker-development
    concurrency:
      group: worker-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect existing Worker settings without deploying
        run: node .github/scripts/inspect-development-worker.mjs
        env:
          INSPECTION_REQUEST: ${{ github.event.head_commit.message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
