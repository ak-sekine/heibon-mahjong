name: Issue 47 Pages dependency probe and read-only inspection
on: workflow_dispatch
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  main:
    uses: ./.github/workflows/issue47-pages-condition-probe.yml
    with:
      release_ref: refs/heads/main
  develop:
    uses: ./.github/workflows/issue47-pages-condition-probe.yml
    with:
      release_ref: refs/heads/develop
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: pages-verified
          path: store
          fetch-depth: 2
          persist-credentials: false
      - name: Read Worker and compare currently served Pages with the pre-reservation snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$(git -C store rev-parse HEAD)" = 1d538542c75bf0b49f468acb55ad414c35ce0c10
          test "$(git -C store show -s --format=%P HEAD)" = d4d9a8a7cc9723b9d4a1b5eac9c829929cb4cb61
          mkdir previous
          git -C store archive HEAD^ site state.json | tar -x -C previous
          node .github/scripts/issue47-pages-inspection.mjs
