name: Issue 47 read-only production release audit
run-name: Issue 47 audit of snapshot ${{ inputs.snapshot }}
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Expected pages-verified commit
        type: string
        required: true
      production_run:
        description: New production run ID (leave empty for the pre-publication audit)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  deployments: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: pages-verified
          path: store
          fetch-depth: 3
          persist-credentials: false
      - name: Compare Cloudflare deployments and public Pages with the finalized snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AUDIT_SNAPSHOT: ${{ inputs.snapshot }}
          AUDIT_PRODUCTION_RUN: ${{ inputs.production_run }}
        run: node .github/scripts/issue47-pages-inspection.mjs
