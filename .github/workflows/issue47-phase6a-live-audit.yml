name: Issue 47 Phase 6-A live Pages audit
run-name: Issue 47 Phase 6-A audit @ ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      audit_failed_reservation:
        description: Compare production Worker and Pages with the snapshot before failed run 44839474104
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: issue47-phase6a-live-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Initialize audit diagnostics
        run: |
          mkdir -p artifacts
          printf '%s\n' '{"schemaVersion":1,"outcome":"NOT_STARTED"}' > artifacts/phase6a-live-audit.json
      - name: Checkout audit code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout read-only pages-verified snapshot
        uses: actions/checkout@v4
        with:
          ref: pages-verified
          path: pages-verified
          persist-credentials: false
          fetch-depth: 2
      - name: Record snapshot branch SHA
        id: snapshot
        env:
          RECOVERY_AUDIT: ${{ inputs.audit_failed_reservation }}
        run: |
          set -euo pipefail
          head=$(git -C pages-verified rev-parse HEAD)
          if [[ "$RECOVERY_AUDIT" != true ]]; then
            echo "sha=$head" >> "$GITHUB_OUTPUT"
            echo "root=pages-verified" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$GITHUB_REF" = refs/heads/develop
          previous=0259f5d5d5abbecf0ce1e111598f5ce18805712b
          test "$head" = 9e88b5e100ed17442a3c51c345e705e2e18dcc5a
          test "$(git -C pages-verified show -s --format=%P HEAD)" = "$previous"
          mkdir -p pre-reservation
          git -C pages-verified archive "$previous" site state.json | tar -x -C pre-reservation
          jq -e --slurpfile before pre-reservation/state.json '
            .version == 1 and $before[0].version == 1 and $before[0].pending == null and
            .current == $before[0].current and .pending.previous == $before[0].current and
            .pending.current.development == $before[0].current.development and
            .pending.environment == "production" and
            .pending.sha == "1ae2243f53e3b85187dd36279b5cf726f73b1c39" and
            .pending.reservation == {runId:"44839474104", attempt:"1"}
          ' pages-verified/state.json > /dev/null
          echo "sha=$previous" >> "$GITHUB_OUTPUT"
          echo "root=pre-reservation" >> "$GITHUB_OUTPUT"
          echo "reservation=$head" >> "$GITHUB_OUTPUT"
      - name: Audit public Pages URLs and saved snapshot
        env:
          AUDIT_REPORT_PATH: artifacts/phase6a-live-audit.json
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ROOT: ${{ steps.snapshot.outputs.root }}
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha }}
          AUDIT_RESERVATION_SHA: ${{ steps.snapshot.outputs.reservation }}
          CLOUDFLARE_API_TOKEN: ${{ inputs.audit_failed_reservation && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.audit_failed_reservation && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          WORKER_BASELINE_DEPLOYMENT: 3b6587ac-79fd-49a8-b6d1-2f77a9022331
          WORKER_BASELINE_VERSION: 85e9510f-3f21-45c1-b0ff-4a4de66e7749
        run: node scripts/environments/pages-live-audit.mjs
      - name: Upload audit diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue47-phase6a-live-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/phase6a-live-audit.json
          if-no-files-found: warn
          retention-days: 90
