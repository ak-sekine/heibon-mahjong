name: Temporary read-only development Worker diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.repository == 'ak-sekine/heibon-mahjong' && github.ref == 'refs/heads/issue/69-independent-publication-v2' }}
    environment: worker-development
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Cloudflare Worker deployment and Durable Object bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN }}
        run: |
          node <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!/^[a-f0-9]{32}$/i.test(account || '') || !token) {
            console.log(JSON.stringify({stage:'configuration', error:'account or environment credential unavailable'}));
            process.exit(1);
          }
          const worker = 'heibon-mahjong-online-dev';
          async function read(suffix) {
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}/${suffix}`;
            try {
              const response = await fetch(endpoint, {headers:{authorization:`Bearer ${token}`},redirect:'error',signal:AbortSignal.timeout(20000)});
              const body = await response.json();
              if (!response.ok || body.success !== true) return {status:response.status, success:false, codes:(body.errors||[]).map(x=>x.code).filter(Number.isInteger)};
              if (suffix === 'deployments') {
                const list = body.result?.deployments;
                return {status:response.status, success:true, deployments:Array.isArray(list)?list.slice(0,2).map(d=>({id:d.id,created_on:d.created_on,versions:d.versions?.map(v=>({version_id:v.version_id,percentage:v.percentage}))})):null};
              }
              return {status:response.status,success:true,bindings:(body.result?.bindings||[]).filter(b=>b.type==='durable_object_namespace').map(({name,class_name,script_name,namespace_id})=>({name,class_name,script_name,namespace_id}))};
            } catch { return {status:null,success:false,error:'request or response failed'}; }
          }
          (async()=>{const deployments=await read('deployments'); const settings=await read('settings'); console.log(JSON.stringify({account,worker,deployments,settings})); if(!deployments.success || !settings.success) process.exitCode=1})()
          NODE
