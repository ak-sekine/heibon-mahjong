name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run npm test
        shell: bash
        run: |
          if npm test > /tmp/heibon-npm-test.log 2>&1; then
            cat /tmp/heibon-npm-test.log
          else
            test_status=$?
            cat /tmp/heibon-npm-test.log
            test_failure="$(tail -n 30 /tmp/heibon-npm-test.log | tr '\n' ' ' | cut -c1-4000)"
            test_failure="${test_failure//'%'/'%25'}"
            test_failure="${test_failure//$'\r'/'%0D'}"
            test_failure="${test_failure//$'\n'/'%0A'}"
            echo "::error title=npm test failed::${test_failure}"
            exit "$test_status"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
