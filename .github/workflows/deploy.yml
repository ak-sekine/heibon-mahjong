name: Deploy to GitHub Pages and Cloudflare Workers
run-name: Verify and deploy ${{ github.ref_name }} @ ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: Deploy Worker and Pages after full verification succeeds.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      run_full_suite: ${{ steps.classify.outputs.run_full_suite }}
      deploy_required: ${{ steps.classify.outputs.deploy_required }}
      classification: ${{ steps.classify.outputs.classification }}
      pending_release: ${{ steps.classify.outputs.pending_release }}
      state_reliable: ${{ steps.classify.outputs.state_reliable }}
      target_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read successful Worker and Pages deployment records
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/deployment-state.mjs inspect
      - name: Compare current changes and pending releases
        id: classify
        env:
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_TO_PRODUCTION: ${{ inputs.deploy_to_production }}
          WORKER_SHA: ${{ steps.state.outputs.worker_sha }}
          PAGES_SHA: ${{ steps.state.outputs.pages_sha }}
          API_STATE_RELIABLE: ${{ steps.state.outputs.state_reliable }}
        shell: bash
        run: |
          set +e
          STATE_RELIABLE="$API_STATE_RELIABLE"
          CURRENT_DIFF_RELIABLE=true
          : > "$RUNNER_TEMP/current-paths"
          : > "$RUNNER_TEMP/worker-paths"
          : > "$RUNNER_TEMP/pages-paths"
          git rev-parse --verify "${HEAD_REF}^{commit}" >/dev/null 2>&1 || CURRENT_DIFF_RELIABLE=false
          if [[ -n "$BASE_REF" ]] && git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            git diff --no-renames --name-only -z "$BASE_REF" "$HEAD_REF" -- > "$RUNNER_TEMP/current-paths" || CURRENT_DIFF_RELIABLE=false
          else
            CURRENT_DIFF_RELIABLE=false
          fi
          if [[ "$WORKER_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && git rev-parse --verify "${WORKER_SHA}^{commit}" >/dev/null 2>&1; then
            git diff --no-renames --name-only -z "$WORKER_SHA" "$HEAD_REF" -- > "$RUNNER_TEMP/worker-paths" || STATE_RELIABLE=false
          else
            STATE_RELIABLE=false
          fi
          if [[ "$PAGES_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && git rev-parse --verify "${PAGES_SHA}^{commit}" >/dev/null 2>&1; then
            git diff --no-renames --name-only -z "$PAGES_SHA" "$HEAD_REF" -- > "$RUNNER_TEMP/pages-paths" || STATE_RELIABLE=false
          else
            STATE_RELIABLE=false
          fi
          set -e
          CURRENT_PATHS="$RUNNER_TEMP/current-paths" \
          WORKER_PATHS="$RUNNER_TEMP/worker-paths" \
          PAGES_PATHS="$RUNNER_TEMP/pages-paths" \
          STATE_RELIABLE="$STATE_RELIABLE" \
          CURRENT_DIFF_RELIABLE="$CURRENT_DIFF_RELIABLE" \
          node .github/scripts/deployment-decision.mjs
          echo "target_sha=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "Release target SHA: $HEAD_REF"

  release-freshness:
    needs: [detect-changes, verify, browser-ui]
    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.deploy_required == 'true' &&
        needs.verify.result == 'success' &&
        needs.browser-ui.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the latest main SHA before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment requires refs/heads/main; requested target is $EVENT_REF at $TARGET_SHA."
            exit 1
          fi
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$latest_sha" != "$TARGET_SHA" ]]; then
            echo "::error::Refusing to publish stale SHA $TARGET_SHA; main is now $latest_sha. The newer run must publish the latest commit."
            exit 1
          fi
          echo "Verified release target $TARGET_SHA is current main."

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files for whitespace errors
        env:
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "$BASE_REF" ]] && git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            git diff --check "$BASE_REF" "$HEAD_REF" --
          else
            git show --check --format= --no-renames "$HEAD_REF"
          fi

  verify:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_full_suite == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Typecheck the Cloudflare Worker
        run: npm run typecheck:worker
      - name: Build the Pages application
        run: npm run build
      - name: Save the verified browser test build
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error

  browser-ui:
    uses: ./.github/workflows/browser-ui.yml
    needs: [detect-changes, verify]
    if: >-
      ${{
        always() &&
        needs.detect-changes.result == 'success' &&
        (needs.verify.result == 'success' || needs.detect-changes.outputs.run_full_suite != 'true')
      }}
    with:
      reuse_build: ${{ needs.detect-changes.outputs.run_full_suite == 'true' }}

  deploy-worker:
    needs: [detect-changes, verify, browser-ui, release-freshness]
    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.deploy_required == 'true' &&
        needs.verify.result == 'success' &&
        needs.browser-ui.result == 'success' &&
        needs.release-freshness.result == 'success' &&
        (github.event_name != 'workflow_dispatch' || inputs.deploy_to_production == true)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Deploy with the official Wrangler CLI
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          deploy_output="$(npx wrangler deploy --config wrangler.jsonc 2>&1)"
          deploy_status=$?
          set -e
          if [ "$deploy_status" -ne 0 ]; then
            echo "::error title=Cloudflare deployment failed::Wrangler failed. Output is suppressed to keep credentials out of logs. If the account has not initialized its workers.dev subdomain, complete that setup in the Cloudflare dashboard; do not change authentication settings to bypass it."
            exit "$deploy_status"
          fi
          worker_url="$(printf '%s\n' "$deploy_output" | grep -Eo 'https://heibon-mahjong-online\.[[:alnum:]-]+\.workers\.dev' | tail -n 1 || true)"
          unset deploy_output
          if [[ ! "$worker_url" =~ ^https://heibon-mahjong-online\.[[:alnum:]-]+\.workers\.dev$ ]]; then
            echo "::error title=Worker URL was not reported::Wrangler completed without reporting the deployed workers.dev URL. No URL was inferred."
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Published Worker URL: $worker_url"
      - name: Record successful Worker deployment SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/deployment-state.mjs record worker

  production-test:
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify HTTPS, rooms, WebSockets, reconnection, auth, and privacy
        env:
          ONLINE_API_URL: ${{ needs.deploy-worker.outputs.worker_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: npm run test:online:production

  pages-build:
    needs: [detect-changes, verify, browser-ui, deploy-worker, production-test]
    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.deploy_required == 'true' &&
        needs.verify.result == 'success' &&
        needs.browser-ui.result == 'success' &&
        needs.deploy-worker.result == 'success' &&
        needs.production-test.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build Pages with the deployed public Worker URL
        env:
          VITE_ONLINE_API_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: |
          npm run build
          if ! grep -R -F -q --include='*.js' "$VITE_ONLINE_API_URL" dist/assets; then
            echo "::error title=Worker URL missing from Pages bundle::The deployed Worker URL was not included in the GitHub Pages build."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful GitHub Pages deployment SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/deployment-state.mjs record pages
