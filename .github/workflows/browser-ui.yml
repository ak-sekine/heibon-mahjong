name: Browser UI verification

on:
  push:
    branches: [fix-mobile-table-layout, ui-river-spacing, fix-riichi-discard-layout, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run Vite and browser regressions
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/heibon-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/heibon-mahjong/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/heibon-mahjong/ > /dev/null
          export HEIBON_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export HEIBON_SCREENSHOTS=/tmp/heibon-table-ui
          python tests/browser-riichi-discard-layout.py
          python tests/browser-table-ui.py
          python tests/browser-dora-rows.py
          python tests/browser-mobile-table-layout.py
          python tests/browser-step13-5-5.py
          python tests/browser-step13-5-5-kan.py
      - name: Save browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ github.sha }}
          if-no-files-found: warn
          path: |
            /tmp/heibon-table-ui
            /tmp/heibon-vite.log
            docs/verification/step13.5.5
