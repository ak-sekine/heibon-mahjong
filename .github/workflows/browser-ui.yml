name: Browser UI verification

on:
  push:
    branches: [main, fix-mobile-table-layout, ui-river-spacing, fix-riichi-discard-layout]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run npm test
        shell: bash
        run: |
          if npm test > /tmp/heibon-npm-test.log 2>&1; then
            cat /tmp/heibon-npm-test.log
          else
            test_status=$?
            cat /tmp/heibon-npm-test.log
            test_failure="$(tail -n 30 /tmp/heibon-npm-test.log | tr '\n' ' ' | cut -c1-4000)"
            test_failure="${test_failure//'%'/'%25'}"
            test_failure="${test_failure//$'\r'/'%0D'}"
            test_failure="${test_failure//$'\n'/'%0A'}"
            echo "::error title=npm test failed::${test_failure}"
            exit "$test_status"
          fi
      - run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium webkit
      - name: Run Vite and browser regressions
        shell: bash
        run: |
          VITE_ONLINE_API_URL=https://online-mock.invalid npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/heibon-vite.log 2>&1 &
          vite_pid=$!
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/heibon-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$vite_pid" "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/heibon-mahjong/ > /dev/null && curl --fail --silent http://127.0.0.1:4174/heibon-mahjong/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/heibon-mahjong/ > /dev/null
          curl --fail --silent http://127.0.0.1:4174/heibon-mahjong/ > /dev/null
          export HEIBON_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export HEIBON_SCREENSHOTS=/tmp/heibon-table-ui
          run_browser_test() {
            browser_script="$1"
            if browser_output="$(python "$browser_script" 2>&1)"; then
              printf '%s\n' "$browser_output"
              return 0
            else
              browser_status=$?
              printf '%s\n' "$browser_output"
              browser_failure_line="$(printf '%s\n' "$browser_output" | tail -n 6 | tr '\n' ' ' | cut -c1-4000)"
              browser_failure_line="${browser_failure_line//'%'/'%25'}"
              browser_failure_line="${browser_failure_line//$'\r'/'%0D'}"
              browser_failure_line="${browser_failure_line//$'\n'/'%0A'}"
              echo "::error title=Browser UI failed (${browser_script})::${browser_failure_line}"
              return "$browser_status"
            fi
          }
          HEIBON_PRODUCTION_URL=http://127.0.0.1:4174/heibon-mahjong/ run_browser_test tests/browser-online-dialog-layout.py
          run_browser_test tests/browser-app-idle.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-app-idle.py
          HEIBON_ONLINE_EXIT_NOTICE_ONLY=1 run_browser_test tests/browser-online-waiting-room.py
          HEIBON_BROWSER=webkit HEIBON_ONLINE_EXIT_NOTICE_ONLY=1 run_browser_test tests/browser-online-waiting-room.py
          run_browser_test tests/browser-riichi-discard-layout.py
          run_browser_test tests/browser-action-controls.py
          run_browser_test tests/browser-action-panel.py
          run_browser_test tests/browser-table-ui.py
          run_browser_test tests/browser-riichi-claimed-discard.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-riichi-claimed-discard.py
          run_browser_test tests/browser-river-capacity.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-river-capacity.py
          run_browser_test tests/browser-declaration-bubbles.py
          run_browser_test tests/browser-declaration-gameplay.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-declaration-gameplay.py
          run_browser_test tests/browser-round-end-ui.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-round-end-ui.py
          run_browser_test tests/browser-result-hand-layout.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-result-hand-layout.py
          run_browser_test tests/browser-dora-rows.py
          run_browser_test tests/browser-mobile-table-layout.py
          run_browser_test tests/browser-seat-kan-overlap.py
          run_browser_test tests/browser-step13-5-5.py
          run_browser_test tests/browser-step13-5-5-kan.py
          run_browser_test tests/browser-step13-6.py
          run_browser_test tests/browser-step13-7.py
          run_browser_test tests/browser-step13-8.py
          run_browser_test tests/browser-step13-9.py
          run_browser_test tests/browser-step13-10.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-step13-10.py
          run_browser_test tests/browser-step13-11.py
          HEIBON_ONLINE_RIVER_SPACING_ONLY=1 run_browser_test tests/browser-online-waiting-room.py
          HEIBON_BROWSER=webkit HEIBON_ONLINE_RIVER_SPACING_ONLY=1 run_browser_test tests/browser-online-waiting-room.py
          run_browser_test tests/browser-online-waiting-room.py
          HEIBON_BROWSER=webkit HEIBON_ONLINE_PUBLIC_HAND_ONLY=1 run_browser_test tests/browser-online-waiting-room.py
          run_browser_test tests/browser-test-page.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-test-page.py
          run_browser_test tests/browser-river-test-mode.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-river-test-mode.py
          run_browser_test tests/browser-diagnostics.py
          HEIBON_BROWSER=webkit run_browser_test tests/browser-diagnostics.py
      - name: Save browser results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ github.sha }}
          if-no-files-found: warn
          path: |
            /tmp/heibon-table-ui
            /tmp/heibon-vite.log
            /tmp/heibon-preview.log
            docs/verification/step13.5.5
      - name: Save river spacing failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-spacing-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            /tmp/heibon-table-ui/river-spacing-failure-*.png
            /tmp/heibon-table-ui/river-spacing-failure-*.json
