name: Browser UI verification

on:
  # main is verified through Deploy, which calls this workflow exactly once.
  push:
    branches: [develop, fix-mobile-table-layout, ui-river-spacing, fix-riichi-discard-layout]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_build:
        description: Reuse the verified dist artifact produced by the calling workflow.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    if: ${{ !inputs.reuse_build }}
    runs-on: ubuntu-latest
    outputs:
      run_full_suite: ${{ steps.classify.outputs.run_full_suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "$BASE_REF" ]] && git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1 \
            && git rev-parse --verify "${HEAD_REF}^{commit}" >/dev/null 2>&1; then
            if git diff --no-renames --name-only -z "$BASE_REF" "$HEAD_REF" -- > "$RUNNER_TEMP/changed-paths"; then
              node .github/scripts/classify-changes.mjs < "$RUNNER_TEMP/changed-paths"
            else
              node .github/scripts/classify-changes.mjs --unsafe
            fi
          else
            node .github/scripts/classify-changes.mjs --unsafe
          fi

  docs-check:
    if: ${{ !inputs.reuse_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files for whitespace errors
        env:
          BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "$BASE_REF" ]] && git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            git diff --check "$BASE_REF" "$HEAD_REF" --
          else
            git show --check --format= --no-renames "$HEAD_REF"
          fi

  verify-build:
    needs: detect-changes
    if: ${{ always() && !inputs.reuse_build && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.run_full_suite == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run all unit and integration tests
        run: npm test
      - name: Build the browser test site
        run: npm run build
      - name: Build the standalone itch browser test site
        env:
          VITE_ONLINE_API_URL: https://online-mock.invalid
        run: npm run build:itch
      - name: Save the verified browser test build
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
      - name: Save the verified itch browser build
        uses: actions/upload-artifact@v4
        with:
          name: itch-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist-itch
          if-no-files-found: error

  browser-ui:
    needs: [detect-changes, verify-build]
    if: >-
      ${{
        always() &&
        (inputs.reuse_build || (
          needs.detect-changes.result == 'success' &&
          needs.detect-changes.outputs.run_full_suite == 'true' &&
          needs.verify-build.result == 'success'
        ))
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare engine-specific diagnostics
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p /tmp/heibon-table-ui
          printf 'script,browser,start_utc,end_utc,duration_seconds,status,timed_out\n' > "/tmp/heibon-browser-ui-timings.csv"
          : > "/tmp/heibon-browser-ui-${BROWSER}.log"
          : > /tmp/heibon-vite.log
          : > /tmp/heibon-preview.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Browser UI engine selection
        if: ${{ matrix.browser == 'chromium' }}
        run: python tests/test_browser_regressions_selection.py
      - run: npm ci
      - name: Download verified build from Deploy workflow
        if: ${{ inputs.reuse_build }}
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - name: Download verified build from this workflow
        if: ${{ !inputs.reuse_build }}
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - name: Download verified itch build
        uses: actions/download-artifact@v4
        with:
          name: itch-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist-itch
      - run: python -m pip install playwright
      - name: Test itch smoke startup transitions
        run: python tests/test_itch_smoke_startup.py
      - name: Record Playwright install environment
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import os
          import platform
          from pathlib import Path
          import playwright

          try:
              os_release = platform.freedesktop_os_release()
              operating_system = {
                  "name": os_release.get("NAME"),
                  "version": os_release.get("VERSION_ID"),
              }
          except (AttributeError, OSError):
              operating_system = {"name": None, "version": None}

          image = {
              key: os.environ.get(key)
              for key in ("ImageOS", "ImageVersion")
          }
          browsers_file = Path(playwright.__file__).parent / "driver/package/browsers.json"
          revision = None
          try:
              browser_registry = json.loads(browsers_file.read_text(encoding="utf-8"))
              revision = next(
                  (item.get("revision") for item in browser_registry.get("browsers", [])
                   if item.get("name") == os.environ["BROWSER"]),
                  None,
              )
          except (OSError, ValueError, KeyError):
              pass

          print("[playwright-install-environment] " + json.dumps({
              "runner_os": os.environ.get("RUNNER_OS"),
              "os": operating_system,
              "runner_image": image,
              "python": platform.python_version(),
              "playwright": importlib.metadata.version("playwright"),
              "browser": os.environ["BROWSER"],
              "browser_revision": revision,
          }, separators=(",", ":")))
          PY
      - name: Install OS dependencies (${{ matrix.browser }})
        shell: bash
        run: python .github/scripts/timed-playwright-install.py install-deps "${{ matrix.browser }}"
      - name: Install browser (${{ matrix.browser }})
        shell: bash
        run: python .github/scripts/timed-playwright-install.py install "${{ matrix.browser }}"
      - name: Run standalone itch smoke test before Browser UI suite
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 4175 --bind 127.0.0.1 --directory dist-itch > /tmp/heibon-itch-preview-before.log 2>&1 &
          smoke_preview_pid=$!
          trap 'kill "$smoke_preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/ > /dev/null
          mkdir -p /tmp/heibon-itch-smoke-before
          set -o pipefail
          HEIBON_BROWSER="$BROWSER" HEIBON_SMOKE_ARTIFACT_DIR=/tmp/heibon-itch-smoke-before HEIBON_SMOKE_REPETITIONS=3 python tests/browser-itch-package.py 2>&1 | tee /tmp/heibon-itch-smoke-before.log
      - name: Run Vite and browser regressions
        shell: bash
        env:
          HEIBON_BROWSER_TIMINGS: /tmp/heibon-browser-ui-timings.csv
        run: |
          VITE_ONLINE_API_URL=https://online-mock.invalid npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/heibon-vite.log 2>&1 &
          vite_pid=$!
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/heibon-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$vite_pid" "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/heibon-mahjong/ > /dev/null && curl --fail --silent http://127.0.0.1:4174/heibon-mahjong/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/heibon-mahjong/ > /dev/null
          curl --fail --silent http://127.0.0.1:4174/heibon-mahjong/ > /dev/null
          if [[ "${{ matrix.browser }}" == chromium ]]; then
            export HEIBON_CHROMIUM="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          fi
          export HEIBON_SCREENSHOTS=/tmp/heibon-table-ui
          set -o pipefail
          python tests/run-browser-regressions.py --browser "${{ matrix.browser }}" 2>&1 | tee "/tmp/heibon-browser-ui-${{ matrix.browser }}.log"
      - name: Report winning hand geometry
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python - <<'PY_GEOMETRY'
          import json
          import os
          from pathlib import Path

          reports = json.loads(Path('/tmp/heibon-table-ui/round-end-ui.json').read_text(encoding='utf-8'))
          viewport = next(report for report in reports if report['viewport'] == [320, 568])
          variant = next(case for case in viewport['roundVariants'] if case['scenario'] == 'yakuman-ron')
          hand = next(hand for hand in variant['handOrder'] if hand['id'] == 1)
          # A separate step keeps this measurement within GitHub's per-step
          # annotation limit, independently of the full suite's timing notices.
          print('::notice title=Winning hand geometry::' + json.dumps({
              'browser': os.environ['BROWSER'], 'viewport': viewport['viewport'],
              'scenario': variant['scenario'], **hand,
          }))
          PY_GEOMETRY
      - name: Run standalone itch smoke test after Browser UI suite
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 4175 --bind 127.0.0.1 --directory dist-itch > /tmp/heibon-itch-preview.log 2>&1 &
          itch_preview_pid=$!
          trap 'kill "$itch_preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/ > /dev/null
          mkdir -p /tmp/heibon-itch-smoke
          set -o pipefail
          HEIBON_BROWSER="$BROWSER" HEIBON_SMOKE_ARTIFACT_DIR=/tmp/heibon-itch-smoke HEIBON_SMOKE_REPETITIONS=3 python tests/browser-itch-package.py 2>&1 | tee /tmp/heibon-itch-smoke-after.log
      - name: Verify standalone itch smoke failure diagnostics
        shell: bash
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m http.server 4175 --bind 127.0.0.1 --directory dist-itch > /tmp/heibon-itch-preview-controlled.log 2>&1 &
          controlled_preview_pid=$!
          trap 'kill "$controlled_preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/ > /dev/null
          set -o pipefail
          if HEIBON_BROWSER="$BROWSER" HEIBON_SMOKE_ARTIFACT_DIR=/tmp/heibon-itch-smoke-controlled HEIBON_SMOKE_REPETITIONS=1 HEIBON_SMOKE_INDUCE_FAILURE=after-discard python tests/browser-itch-package.py 2>&1 | tee /tmp/heibon-itch-smoke-controlled.log; then
            echo "Controlled failure did not fail as expected"
            exit 1
          fi
          test -s "/tmp/heibon-itch-smoke-controlled/${BROWSER}-iteration-1.png"
          test -s "/tmp/heibon-itch-smoke-controlled/${BROWSER}-iteration-1.zip"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          browser = os.environ["BROWSER"]
          report = json.loads(Path(f"/tmp/heibon-itch-smoke-controlled/{browser}-iteration-1.json").read_text(encoding="utf-8"))
          assert report["error"] == "controlled failure to verify smoke diagnostics artifact capture", report
          assert report["observations"]["beforeDiscard"]["phase"] == "awaiting-discard", report
          events = report["gameState"]["diagnostics"]
          assert any(event["event"] == "local_game_diagnostic_snapshot" for event in events), report
          action = report["observations"]["discardDestination"]
          assert action["river"] + action["calledMeld"] == 1 and not action["hand"], report
          print(f"{browser}: controlled failure produced screenshot, Playwright trace, and safe game-state JSON")
          PY
      - name: Save browser results, script timings, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ matrix.browser }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            /tmp/heibon-browser-ui-timings.csv
            /tmp/heibon-browser-ui-${{ matrix.browser }}.log
            /tmp/heibon-table-ui
            /tmp/heibon-vite.log
            /tmp/heibon-preview.log
            /tmp/heibon-itch-preview.log
            /tmp/heibon-itch-preview-controlled.log
            /tmp/heibon-itch-preview-before.log
            /tmp/heibon-itch-smoke-before.log
            /tmp/heibon-itch-smoke-after.log
            /tmp/heibon-itch-smoke-controlled.log
            /tmp/heibon-itch-smoke
            /tmp/heibon-itch-smoke-before
            /tmp/heibon-itch-smoke-controlled
            docs/verification/step13.5.5
      - name: Save candidate frame review screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-frame-${{ matrix.browser }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            /tmp/heibon-table-ui/candidate-geometry/*.json
            /tmp/heibon-table-ui/candidate-geometry/*-320x568-*-chi-*.png
            /tmp/heibon-table-ui/candidate-geometry/*-1280x720-*-chi-*.png
            /tmp/heibon-table-ui/candidate-geometry/*-1920x1080-*-mixed-kan-*.png
      - name: Save center round display screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: center-round-display-${{ matrix.browser }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: /tmp/heibon-table-ui/center-round-display
      - name: Save river spacing failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-spacing-diagnostics-${{ matrix.browser }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            /tmp/heibon-table-ui/river-spacing-failure-*.png
            /tmp/heibon-table-ui/river-spacing-failure-*.json
