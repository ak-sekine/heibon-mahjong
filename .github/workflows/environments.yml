name: Verify isolated environments
run-name: Environments ${{ github.ref_name }} @ ${{ github.sha }}
on:
  push:
    branches: [main, develop, 'issue/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after external isolation and bootstrap have been verified.
        required: true
        type: boolean
        default: false
      publication_target:
        description: Choose the existing combined publication or the independent Worker route.
        type: choice
        options: [both, worker, pages]
        default: both
      production_validation:
        description: Reuse verified main push CI, or explicitly run full validation for production.
        type: choice
        options: [reuse, full]
        default: reuse
permissions:
  contents: read
jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      run_full_suite: ${{ steps.classify.outputs.run_full_suite }}
      classification: ${{ steps.classify.outputs.classification }}
      reuse: >-
        ${{ github.repository == 'ak-sekine/heibon-mahjong'
          && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
          && inputs.publish == true && vars.DUAL_PAGES_ENABLED == 'true'
          && inputs.production_validation == 'reuse' && inputs.publication_target != 'worker' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "push" && -n "$BASE_REF" ]] \
            && git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1 \
            && git rev-parse --verify "${HEAD_REF}^{commit}" >/dev/null 2>&1; then
            if git diff --no-renames --name-only -z "$BASE_REF" "$HEAD_REF" -- > "$RUNNER_TEMP/changed-paths"; then
              node .github/scripts/classify-changes.mjs < "$RUNNER_TEMP/changed-paths"
            else
              node .github/scripts/classify-changes.mjs --unsafe
            fi
          else
            # PRs and all manual runs retain the full suite regardless of paths.
            node .github/scripts/classify-changes.mjs --unsafe
          fi

  docs-check:
    needs: classify-changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files for whitespace errors
        env:
          BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "$BASE_REF" ]] && git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1 \
            && git rev-parse --verify "${HEAD_REF}^{commit}" >/dev/null 2>&1; then
            git diff --check "$BASE_REF" "$HEAD_REF" --
          else
            git show --check --format= --no-renames "$HEAD_REF"
          fi

  verify:
    needs: classify-changes
    if: >-
      ${{ !cancelled() && needs.classify-changes.outputs.reuse != 'true'
        && (needs.classify-changes.result != 'success'
        || needs.classify-changes.outputs.run_full_suite != 'false') }}
    runs-on: ubuntu-latest
    outputs:
      pages_id: ${{ steps.pages.outputs.artifact-id }}
      pages_digest: ${{ steps.pages.outputs.artifact-digest }}
      development_id: ${{ steps.development.outputs.artifact-id }}
      development_digest: ${{ steps.development.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate raw publication variables without exposing values
        env:
          PRODUCTION_WORKER_URL: ${{ vars.PRODUCTION_WORKER_URL }}
          DEVELOPMENT_WORKER_URL: ${{ vars.DEVELOPMENT_WORKER_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DUAL_PAGES_ENABLED: ${{ vars.DUAL_PAGES_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate-publication-settings.mjs
          node .github/scripts/validate-publication-mode.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - name: Build the exact candidates (fallback URLs are test fixtures only)
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_WORKER_URL || 'https://heibon-mahjong-online.validation.workers.dev' }}
          DEVELOPMENT_URL: ${{ vars.DEVELOPMENT_WORKER_URL || 'https://heibon-mahjong-online-dev.validation.workers.dev' }}
        run: |
          PRODUCTION_URL="${PRODUCTION_URL%/}"
          DEVELOPMENT_URL="${DEVELOPMENT_URL%/}"
          VITE_ONLINE_API_URL="$PRODUCTION_URL" npm run build
          VITE_ONLINE_API_URL="$DEVELOPMENT_URL" npm run build:dev
          VITE_ONLINE_API_URL=https://online-mock.invalid npm run build:itch
          test -s artifacts/itch/heibon-mahjong.zip
          node scripts/environments/artifacts.mjs seal dist production "$GITHUB_SHA" "$PRODUCTION_URL"
          node scripts/environments/artifacts.mjs seal dist-dev development "$GITHUB_SHA" "$DEVELOPMENT_URL"
          node scripts/environments/artifacts.mjs verify dist
          node scripts/environments/artifacts.mjs verify dist-dev
      - uses: actions/upload-artifact@v4
        id: pages
        with:
          name: pages-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        id: development
        with:
          name: development-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist-dev
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: itch-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist-itch
          if-no-files-found: error
          retention-days: 90
  browser-ui:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    uses: ./.github/workflows/browser-ui.yml
    with:
      reuse_build: true
  isolation-browser:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: development-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist-dev
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/browser-environments.py
        env:
          HEIBON_BROWSER: ${{ matrix.browser }}
  local-online:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify separate local Worker stores and full online scenarios
        run: |
          npx wrangler dev --local --config wrangler.jsonc --port 8787 --inspector-port 9230 --persist-to "$RUNNER_TEMP/production-do" > "$RUNNER_TEMP/prod-worker.log" 2>&1 &
          prod_pid=$!
          npx wrangler dev --local --config wrangler.development.jsonc --port 8788 --inspector-port 9231 --persist-to "$RUNNER_TEMP/development-do" > "$RUNNER_TEMP/dev-worker.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$prod_pid" "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS -H 'Origin: http://localhost:5173' http://127.0.0.1:8787/health > /dev/null && curl -fsS -H 'Origin: http://localhost:5173' http://127.0.0.1:8788/health > /dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS -H 'Origin: http://localhost:5173' http://127.0.0.1:8787/health > /dev/null || ! curl -fsS -H 'Origin: http://localhost:5173' http://127.0.0.1:8788/health > /dev/null; then
            tail -n 100 "$RUNNER_TEMP/prod-worker.log" "$RUNNER_TEMP/dev-worker.log"
            exit 1
          fi
          PRODUCTION_API_URL=http://127.0.0.1:8787 DEVELOPMENT_API_URL=http://127.0.0.1:8788 node tests/online-environments.mjs
          ONLINE_API_URL=http://127.0.0.1:8787 ONLINE_TEST_ORIGIN=http://localhost:5173 npm run test:online:production
          ONLINE_API_URL=http://127.0.0.1:8788 ONLINE_TEST_ORIGIN=http://localhost:5173 npm run test:online:production
  audit:
    needs: [classify-changes, docs-check, verify, browser-ui, isolation-browser, local-online]
    if: ${{ always() && needs.classify-changes.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate Issue publication identity before requesting credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(github.ref, 'refs/heads/issue/') }}
        run: node --input-type=module -e "import { publicationIdentity } from './.github/scripts/publication-reservation.mjs'; publicationIdentity(process.env)"
      - name: Audit all four Browser UI groups for this attempt
        if: >-
          ${{ needs.classify-changes.result != 'success'
            || needs.classify-changes.outputs.run_full_suite != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          node .github/scripts/check-browser-ui-matrix.mjs "$RUNNER_TEMP/jobs.json"
      - name: Confirm intentional docs-only skips
        if: ${{ needs.classify-changes.outputs.run_full_suite == 'false' }}
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          DOCS_RESULT: ${{ needs.docs-check.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_UI_RESULT: ${{ needs.browser-ui.result }}
          ISOLATION_RESULT: ${{ needs.isolation-browser.result }}
          LOCAL_ONLINE_RESULT: ${{ needs.local-online.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          test "$DOCS_RESULT" = success
          test "$VERIFY_RESULT" = skipped
          test "$BROWSER_UI_RESULT" = skipped
          test "$ISOLATION_RESULT" = skipped
          test "$LOCAL_ONLINE_RESULT" = skipped
          echo 'Docs-only change: document checks passed; all heavy environment checks were intentionally skipped.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed when classification is unavailable
        if: >-
          ${{ always() && (needs.classify-changes.result != 'success'
            || (needs.classify-changes.outputs.run_full_suite != 'true'
              && needs.classify-changes.outputs.run_full_suite != 'false')) }}
        run: |
          echo '::error::Change classification did not produce a safe full-suite decision.'
          exit 1
      - name: Record verified Pages artifact identity
        id: pages-evidence
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
            && needs.classify-changes.outputs.run_full_suite == 'true'
            && needs.docs-check.result == 'success' && needs.verify.result == 'success'
            && needs.browser-ui.result == 'success' && needs.isolation-browser.result == 'success'
            && needs.local-online.result == 'success' }}
        env:
          ARTIFACT_ID: ${{ needs.verify.outputs.pages_id }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.pages_digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          printf '%s %s %s %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" > "$RUNNER_TEMP/pages-audit.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.pages-evidence.outcome == 'success' }}
        with:
          name: pages-audit-${{ needs.verify.outputs.pages_id }}-${{ needs.verify.outputs.pages_digest }}
          path: ${{ runner.temp }}/pages-audit.txt
          if-no-files-found: error
          retention-days: 90
  publish:
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch'
        && inputs.publish == true
        && vars.DUAL_PAGES_ENABLED == 'true'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
          || (github.repository == 'ak-sekine/heibon-mahjong' && startsWith(github.ref, 'refs/heads/issue/')))
        && needs.classify-changes.result == 'success' && needs.docs-check.result == 'success'
        && ((needs.classify-changes.outputs.reuse == 'true' && needs.verify.result == 'skipped'
            && needs.browser-ui.result == 'skipped' && needs.isolation-browser.result == 'skipped'
            && needs.local-online.result == 'skipped' && needs.audit.result == 'skipped')
          || (needs.classify-changes.outputs.reuse == 'false' && needs.verify.result == 'success'
            && needs.browser-ui.result == 'success' && needs.isolation-browser.result == 'success'
            && needs.local-online.result == 'success' && needs.audit.result == 'success'
            && (github.ref != 'refs/heads/main' || inputs.production_validation == 'full' || inputs.publication_target == 'worker'))) }}
    needs: [classify-changes, docs-check, verify, browser-ui, isolation-browser, local-online, audit]
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
      deployments: write
    uses: ./.github/workflows/publish-environments.yml
    with:
      reuse_production: ${{ needs.classify-changes.outputs.reuse == 'true' }}
      publication_target: ${{ inputs.publication_target || 'both' }}
      verified_artifact_id: ${{ github.ref_name == 'main' && needs.verify.outputs.pages_id || needs.verify.outputs.development_id }}
      verified_artifact_digest: ${{ github.ref_name == 'main' && needs.verify.outputs.pages_digest || needs.verify.outputs.development_digest }}
    secrets:
      CLOUDFLARE_PRODUCTION_API_TOKEN: ${{ inputs.publication_target != 'pages' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_PRODUCTION_API_TOKEN || '' }}
      CLOUDFLARE_DEVELOPMENT_API_TOKEN: ${{ inputs.publication_target != 'pages' && secrets.CLOUDFLARE_DEVELOPMENT_API_TOKEN || '' }}
