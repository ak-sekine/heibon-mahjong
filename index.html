<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Quill Mahjong — CPU3人とツモ・打牌を繰り返す4人卓" />
  <meta name="theme-color" content="#185640" />
  <title>Quill Mahjong</title>
</head>
<body>
<main>
  <header><h1>Quill Mahjong</h1><button id="new-game" type="button">新しい対局</button></header>
  <section class="dora-area" aria-labelledby="dora-heading">
    <h2 id="dora-heading">ドラ表示牌</h2>
    <div id="dora-indicators" role="group" aria-label="ドラ表示牌と対応するドラ牌種"></div>
  </section>
  <section class="table" aria-label="4人麻雀卓">
    <section class="seat seat-top" data-player-id="2" aria-label="CPU2の席"><p class="seat-label" id="label-2"></p></section>
    <section class="seat seat-right" data-player-id="1" aria-label="CPU1の席"><p class="seat-label" id="label-1"></p></section>
    <section class="seat seat-left" data-player-id="3" aria-label="CPU3の席"><p class="seat-label" id="label-3"></p></section>
    <section class="rivers" aria-label="4人の河">
      <div class="river river-top" data-player-id="2" aria-label="CPU2の河"></div>
      <div class="river river-right" data-player-id="1" aria-label="CPU1の河"></div>
      <div class="river river-bottom" data-player-id="0" aria-label="自分の河"></div>
      <div class="river river-left" data-player-id="3" aria-label="CPU3の河"></div>
      <div class="center-info">
        <div id="wall-count" role="status" aria-live="polite"></div>
      </div>
    </section>
    <section class="seat seat-bottom" data-player-id="0" aria-label="自分の席"><h2 class="seat-label" id="label-0"></h2><ul id="player-hand" aria-label="自分の手牌"></ul></section>
  </section>
  <section class="discard-controls" aria-label="打牌操作">
    <p id="selection-status" role="status" aria-live="polite"></p>
    <button id="discard" type="button" disabled>打牌する</button>
    <button id="tsumo" type="button" disabled>ツモ和了</button>
    <p class="keyboard-help">Tabで牌とボタンへ移動、Enter／Spaceで選択・確定</p>
  </section>
  <section id="win-result" role="status" aria-live="polite" hidden></section>
  <details class="catalog"><summary>開発用：全34種類と赤5を見る</summary><ul id="tile-gallery" aria-label="全牌種と赤5の一覧"></ul></details>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
