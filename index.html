<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Quill Mahjong — 配牌を確認できる日本式麻雀" />
    <meta name="theme-color" content="#185640" />
    <title>Quill Mahjong</title>
  </head>
  <body>
    <main>
      <header><h1>Quill Mahjong</h1><p>配牌を確認できる日本式麻雀</p></header>
      <section class="game-info" aria-label="配牌状況">
        <ul id="cpu-counts"></ul>
        <p id="wall-count" role="status" aria-live="polite"></p>
        <button id="new-game" type="button">新しい対局</button>
      </section>
      <details class="catalog"><summary>全34種類と赤5を見る</summary>
        <ul id="tile-gallery" aria-label="全牌種と赤5の一覧"></ul>
      </details>
      <section class="hand-section" aria-labelledby="hand-heading">
        <h2 id="hand-heading">自分 · 東 · 親 <span>14枚</span></h2>
        <ul id="player-hand" aria-label="自分の手牌13枚と親の追加1枚"></ul>
        <p class="note">右端の離れた牌が親の追加1枚 · 赤5は右上の印が目印</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
