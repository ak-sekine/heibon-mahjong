<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Heibon Mahjong — CPU3人とツモ・打牌を繰り返す4人卓" />
  <meta name="theme-color" content="#185640" />
  <title>Heibon Mahjong</title>
</head>
<body>
<main>
  <header><div><h1>Heibon Mahjong</h1><p id="match-info"></p></div><button id="new-game" type="button">新しい対局</button></header>
  <section class="table" aria-label="4人麻雀卓">
    <section class="seat seat-top" data-player-id="2" aria-label="CPU2の席"><p class="seat-label" id="label-2"></p><div class="concealed-hand" data-player-id="2" role="img"></div><div class="open-melds" data-player-id="2"></div></section>
    <section class="seat seat-right" data-player-id="1" aria-label="CPU1の席"><p class="seat-label" id="label-1"></p><div class="concealed-hand" data-player-id="1" role="img"></div><div class="open-melds" data-player-id="1"></div></section>
    <section class="seat seat-left" data-player-id="3" aria-label="CPU3の席"><p class="seat-label" id="label-3"></p><div class="concealed-hand" data-player-id="3" role="img"></div><div class="open-melds" data-player-id="3"></div></section>
    <section class="rivers" aria-label="4人の河">
      <div class="river river-top" data-player-id="2" aria-label="CPU2の河"></div>
      <div class="river river-right" data-player-id="1" aria-label="CPU1の河"></div>
      <div class="river river-bottom" data-player-id="0" aria-label="自分の河"></div>
      <div class="river river-left" data-player-id="3" aria-label="CPU3の河"></div>
      <div class="center-info"><div id="table-round"></div>
        <div id="wall-count" role="status" aria-live="polite"></div>
        <section class="dora-area" aria-labelledby="dora-heading">
          <h2 id="dora-heading">ドラ表示牌</h2>
          <div id="dora-indicators" role="group" aria-label="ドラ表示牌と対応するドラ牌種"></div>
          <div id="deposit-sticks" hidden></div>
        </section>
      </div>
    </section>
    <section class="seat seat-bottom" data-player-id="0" aria-label="自分の席"><h2 class="seat-label" id="label-0"></h2><div class="open-melds" data-player-id="0"></div><ul id="player-hand" aria-label="自分の手牌"></ul></section>
  </section>
  <section id="public-winning-hands" aria-label="和了したCPUの公開手牌" hidden></section>
  <section class="discard-controls" aria-label="打牌操作">
    <div id="call-controls" hidden role="group" aria-label="ポン・チーの選択">
      <p>副露する組み合わせを選択</p><div id="call-options"></div>
      <button id="pass-calls" type="button">見送る</button>
    </div>
    <div id="kan-controls" hidden role="group" aria-label="暗カン・加カンの選択"><p>カンする面子を選択</p><div id="kan-options"></div><button id="cancel-kan" type="button">キャンセル</button></div>
    <div id="ron-controls" hidden role="group" aria-labelledby="ron-status">
      <p id="ron-status"></p>
      <div id="ron-target"></div>
      <button id="ron" type="button">ロン和了</button>
      <button id="pass-ron" type="button">見逃す</button>
    </div>
    <p id="selection-status" role="status" aria-live="polite"></p>
    <button id="discard" type="button" disabled>打牌する</button>
    <button id="riichi" type="button" disabled>リーチ</button>
    <button id="kan" type="button" hidden>カン</button>
    <button id="tsumo" type="button" disabled>ツモ和了</button>
    <button id="show-result" type="button" hidden>結果を見る</button>
    <p class="keyboard-help">Tabで牌とボタンへ移動、Enter／Spaceで選択・確定</p>
  </section>
  <dialog id="result-dialog" aria-labelledby="result-title">
    <header class="result-header"><h2 id="result-title"></h2></header>
    <div id="result-body" tabindex="0" role="region" aria-label="結果の詳細">
      <section id="win-result" hidden></section>
      <section id="match-result" hidden></section>
    </div>
    <footer class="result-footer">
      <button id="view-table" type="button" autofocus>卓を見る</button>
      <button id="next-round" type="button" hidden>次の局へ</button>
      <button id="result-new-game" type="button" hidden>新しい対局</button>
    </footer>
  </dialog>
  <dialog id="new-game-dialog" aria-labelledby="new-game-question">
    <p id="new-game-question">現在の対局を終了して、最初から始めますか？</p>
    <div class="new-game-actions">
      <button id="cancel-new-game" type="button" autofocus>キャンセル</button>
      <button id="confirm-new-game" type="button">新しい対局を開始</button>
    </div>
  </dialog>
  <details class="catalog"><summary>開発用：全34種類と赤5を見る</summary><ul id="tile-gallery" aria-label="全牌種と赤5の一覧"></ul></details>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
